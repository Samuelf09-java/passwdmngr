name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        required: true
        default: "dev"
  push:
    tags:
      - "v*"

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Validate version format
        id: validate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
            RAW="${RAW#v}"
          fi

          if [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Using version '$RAW'"
            echo "version=$RAW" >> $GITHUB_OUTPUT
          else
            echo "Invalid version '$RAW'. Must be MAJOR.MINOR.PATCH"
            exit 1
          fi

  build:
    needs: validate-version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # LINUX (.deb + .rpm)

      - name: Install Linux build tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential pkgconf \
            libgtk-4-dev libglib2.0-dev libjson-glib-dev \
            libsodium-dev libssl-dev \
            python3 python3-pip meson ninja-build \
            ruby ruby-dev rubygems
          export PATH=/home/runner/.local/share/gem/ruby/*/bin:$PATH
          gem install --user-install fpm

      - name: Build Blueprint compiler (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone https://gitlab.gnome.org/jwestman/blueprint-compiler.git
          cd blueprint-compiler
          meson setup build
          ninja -C build
          sudo ninja -C build install

      - name: Create wrapper for blueprint-compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo mkdir -p /usr/local/bin/blueprint-wrapper
          sudo tee /usr/local/bin/blueprint-wrapper/blueprint-compiler > /dev/null << 'EOF'
          #!/usr/bin/env bash
          export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH
          exec /usr/local/bin/blueprint-compiler "$@"
          EOF
          sudo chmod +x /usr/local/bin/blueprint-wrapper/blueprint-compiler

      - name: Build Linux executable
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PATH="/usr/local/bin/blueprint-wrapper:$PATH"
          make clean
          make

      - name: Package Linux installers (.deb + .rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p usr/bin
          mkdir -p usr/share/applications
          mkdir -p usr/share/icons/hicolor/128x128/apps
          mkdir -p usr/share/passwdmngr

          cp passwdmngr usr/bin/passwdmngr
          cp resources/icons/hicolor/128x128/apps/logo.png usr/share/icons/hicolor/128x128/apps/passwdmngr.png
          cp .github/workflows/installer-data/linux/com.samuelf09.passwdmngr.desktop usr/share/applications/passwdmngr.desktop

          ~/.local/share/gem/ruby/*/bin/fpm \
            -s dir -t deb -n passwdmngr -v ${{ env.VERSION }} \
            --description "A simple password manager" \
            --depends libgtk-4-1 \
            --depends libsodium23 \
            --depends libjson-glib-1.0-0 \
            --prefix=/

          ~/.local/share/gem/ruby/*/bin/fpm \
            -s dir -t rpm -n passwdmngr -v ${{ env.VERSION }} \
            --description "A simple password manager" \
            --depends gtk4 \
            --depends libsodium \
            --depends json-glib \
            --prefix=/

          mv *.deb passwdmngr-${{ env.VERSION }}_x86-64.deb
          mv *.rpm passwdmngr-${{ env.VERSION }}_x86-64.rpm

      - name: Upload Linux installers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            *.deb
            *.rpm

      # macOS (.dmg)

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install gtk4 json-glib libsodium openssl blueprint-compiler pkg-config

      - name: Build macOS executable
        if: matrix.os == 'macos-latest'
        run: |
          make clean
          make

      - name: Create .app skeleton
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/PasswordManager.app/Contents/MacOS
          mkdir -p dist/PasswordManager.app/Contents/Resources
          cp passwdmngr dist/PasswordManager.app/Contents/MacOS/
          cp resources/icons/hicolor/128x128/apps/logo.icns dist/PasswordManager.app/Contents/Resources/

      - name: Add Info.plist
        if: matrix.os == 'macos-latest'
        run: |
          cat > dist/PasswordManager.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PasswordManager</string>
              <key>CFBundleExecutable</key>
              <string>passwdmngr</string>
              <key>CFBundleIdentifier</key>
              <string>com.samuelf09.passwdmngr</string>
              <key>CFBundleVersion</key>
              <string>${{ env.VERSION }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Bundle macOS app
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x .github/workflows/installer-data/macos/bundle-macos.sh
          .github/workflows/installer-data/macos/bundle-macos.sh

      - name: Sign macOS app
        if: matrix.os == 'macos-latest'
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > signing_cert.p12
          security create-keychain -p "buildpass" build.keychain
          security unlock-keychain -p "buildpass" build.keychain
          security import signing_cert.p12 -f pkcs12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -A
          security list-keychains -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpass build.keychain

          for lib in dist/PasswordManager.app/Contents/Frameworks/*.dylib; do
            codesign --force --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" "$lib"
          done

          codesign --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            dist/PasswordManager.app/Contents/MacOS/passwdmngr

          codesign --force --deep --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            dist/PasswordManager.app

      - name: Create DMG
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -volname "Password Manager" \
            -srcfolder dist/PasswordManager.app \
            -ov -format UDZO dist/passwdmngr-${{ env.VERSION }}_arm64.dmg

      - name: Upload DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/passwdmngr-${{ env.VERSION }}_arm64.dmg

      # WINDOWS (.msi)

      - name: Install Windows build tools
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-blueprint-compiler

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          make clean
          make
          mkdir -p dist/
          cp passwdmngr.exe dist/

      - name: Copy DLL dependencies
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          deps=$(ldd dist/passwdmngr.exe)
          echo "$deps"
          echo "$deps" | grep "/mingw64/bin/" | while read -r line; do
              dll=$(echo "$line" | awk -F '=>' '{print $2}' | awk '{print $1}')
              winpath=$(cygpath -w "$dll")
              cp "$winpath" dist/
          done

      - name: Generate WiX components
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dist = "dist"
          $out = "dist-components.wxs"

          $xml = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Fragment>
              <DirectoryRef Id="INSTALLFOLDER">
          "@

          function New-StableGuid($name) {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($name)
              $hash = (New-Object System.Security.Cryptography.SHA1Managed).ComputeHash($bytes)
              $guid = [Guid]::New([BitConverter]::ToString($hash[0..15]).Replace("-", ""))
              return $guid.ToString()
          }

          $components = @()

          Get-ChildItem $dist | ForEach-Object {
              $file = $_.Name
              $id = "File_" + ($file -replace '[^A-Za-z0-9_]', '_')
              $guid = New-StableGuid($file)
              $components += $id

              $xml += @"
                <Component Id="$id" Guid="$guid">
                  <File Id="${id}_File" Source="$dist\$file" />
                </Component>
          "@
          }

          $xml += @"
              </DirectoryRef>
            </Fragment>
            <Fragment>
              <ComponentGroup Id="AppComponents">
          "@

          foreach ($id in $components) {
              $xml += "      <ComponentRef Id=""$id"" />`n"
          }

          $xml += @"
              </ComponentGroup>
            </Fragment>
          </Wix>
          "@

          Set-Content -Path $out -Value $xml

      - name: Build MSI
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --yes
          copy .github/workflows/installer-data/windows/installer.wxs .
          candle.exe installer.wxs dist-components.wxs -dAppDir=dist -dVersion=${{ env.VERSION }}
          light.exe installer.wixobj dist-components.wixobj -ext WixUIExtension -o passwdmngr-${{ env.VERSION }}_x86-64.msi

      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: passwdmngr-${{ env.VERSION }}_x86-64.msi

  # FINAL MERGE JOB

  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Combine installers
        run: |
          mkdir final
          cp installers/linux-installers/*.deb final/
          cp installers/linux-installers/*.rpm final/
          cp installers/macos-dmg/*.dmg final/
          cp installers/windows-msi/*.msi final/

      - name: Upload unified artifact
        uses: actions/upload-artifact@v4
        with:
          name: passwdmngr-installers
          path: final/