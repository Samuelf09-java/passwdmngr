name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install gtk4 json-glib libsodium openssl blueprint-compiler pkg-config

      - name: Build macOS executable
        run: |
          make clean
          make build-macos

      - name: Create .app skeleton
        run: |
          mkdir -p dist/PasswordManager.app/Contents/MacOS
          mkdir -p dist/PasswordManager.app/Contents/Resources
          cp passwdmngr dist/PasswordManager.app/Contents/MacOS/
          cp resources/icons/hicolor/128x128/apps/logo.icns dist/PasswordManager.app/Contents/Resources/

      - name: Add Info.plist
        run: |
          cat > dist/PasswordManager.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PasswordManager</string>

              <key>CFBundleExecutable</key>
              <string>passwdmngr</string>

              <key>CFBundleIdentifier</key>
              <string>com.samuelf09.passwdmngr</string>

              <key>CFBundleVersion</key>
              <string>1.0</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Bundle macOS app
        run: |
          chmod +x macos/bundle-macos.sh
          macos/bundle-macos.sh

      - name: Create DMG
        run: |
          hdiutil create -volname "Password Manager" \
            -srcfolder dist/PasswordManager.app \
            -ov -format UDZO dist/passwdmngr.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/passwdmngr.dmg