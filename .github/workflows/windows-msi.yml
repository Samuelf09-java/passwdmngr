name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-blueprint-compiler

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          make clean
          make build-windows
          mkdir -p dist/
          cp passwdmngr.exe dist/

      - name: Copy DLL dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist

          deps=$(ldd dist/passwdmngr.exe)

          echo "$deps"

          echo "$deps" | grep "/mingw64/bin/" | while read -r line; do
              dll=$(echo "$line" | awk -F '=>' '{print $2}' | awk '{print $1}')
              winpath=$(cygpath -w "$dll")
              cp "$winpath" dist/
          done


      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

  build-msi:
    runs-on: windows-latest
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Generate WiX components
        shell: pwsh
        run: |
          $dist = "dist"
          $out = "dist-components.wxs"

          $xml = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Fragment>
              <DirectoryRef Id="INSTALLFOLDER">
          "@

          function New-StableGuid($name) {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($name)
              $hash = (New-Object System.Security.Cryptography.SHA1Managed).ComputeHash($bytes)
              $guid = [Guid]::New([BitConverter]::ToString($hash[0..15]).Replace("-", ""))
              return $guid.ToString()
          }

          $components = @()

          Get-ChildItem $dist | ForEach-Object {
              $file = $_.Name
              $id = "File_" + ($file -replace '[^A-Za-z0-9_]', '_')
              $guid = New-StableGuid($file)
              $components += $id

              $xml += @"
                <Component Id="$id" Guid="$guid">
                  <File Id="${id}_File" Source="$dist\$file" />
                </Component>
          "@
          }

          $xml += @"
              </DirectoryRef>
            </Fragment>
            <Fragment>
              <ComponentGroup Id="AppComponents">
          "@

          foreach ($id in $components) {
              $xml += "      <ComponentRef Id=""$id"" />`n"
          }

          $xml += @"
              </ComponentGroup>
            </Fragment>
          </Wix>
          "@

          Set-Content -Path $out -Value $xml

      - name: Install WiX Toolset
        run: choco install wixtoolset --yes

      - name: Build MSI
        run: |
          candle.exe installer/installer.wxs dist-components.wxs -dAppDir=dist
          light.exe installer.wixobj dist-components.wixobj -ext WixUIExtension -o passwdmngr.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: passwdmngr-msi
          path: passwdmngr.msi
