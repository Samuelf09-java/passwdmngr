name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-ntldd

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          make clean
          make build-windows

      - name: Auto-detect and copy dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp passwdmngr.exe dist/

          /mingw64/bin/ntldd.exe -R passwdmngr.exe > deps.txt

          grep -E "mingw64[/\\]bin" deps.txt | awk '{print $3}' | while read dll; do
            if [ -f "$dll" ]; then
              cp "$dll" dist/
            else
              echo "Warning: DLL not found: $dll"
            fi
          done

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

