name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-blueprint-compiler

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          make clean
          make build-windows
          mkdir -p dist/
          cp passwdmngr.exe dist/

      - name: Copy DLL dependencies
        shell: pwsh
        run: |
          $mingwBin = "C:\msys64\mingw64\bin"
          Write-Host "Listing $mingwBin:"
          Get-ChildItem $mingwBin | Where-Object Name -like "libgtk-4-1*.dll","libglib-2.0-0*.dll","libgobject-2.0-0*.dll","libjson-glib-1.0-0*.dll","libsodium-26*.dll"

          $msysRoot = "C:\msys64"
          $ldd = "$msysRoot\usr\bin\ldd.exe"
          $cygpath = "$msysRoot\usr\bin\cygpath.exe"

          $deps = & $ldd dist/passwdmngr.exe
          Write-Host "deps: $deps"

          $dlls = $deps | Select-String "/msys64/mingw64/bin" | ForEach-Object {
              ($_ -split "=>")[1].Trim() -replace "\s*\(.*",""
          }

          foreach ($dll in $dlls) {
              $winPath = & $cygpath -w $dll
              if (Test-Path $winPath) {
                  Copy-Item $winPath dist/
              } else {
                  Write-Host "Warning: DLL not found: $dll (Windows: $winPath)"
              }
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

  build-msi:
    runs-on: windows-latest
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Generate WiX components
        shell: pwsh
        run: |
          $dist = "dist"
          $out = "dist-components.wxs"

          $xml = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Fragment>
              <DirectoryRef Id="INSTALLFOLDER">
          "@

          function New-StableGuid($name) {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($name)
              $hash = (New-Object System.Security.Cryptography.SHA1Managed).ComputeHash($bytes)
              $guid = [Guid]::New([BitConverter]::ToString($hash[0..15]).Replace("-", ""))
              return $guid.ToString()
          }

          $components = @()

          Get-ChildItem $dist | ForEach-Object {
              $file = $_.Name
              $id = "File_" + ($file -replace '[^A-Za-z0-9_]', '_')
              $guid = New-StableGuid($file)
              $components += $id

              $xml += @"
                <Component Id="$id" Guid="$guid">
                  <File Id="${id}_File" Source="$dist\$file" />
                </Component>
          "@
          }

          $xml += @"
              </DirectoryRef>
            </Fragment>
            <Fragment>
              <ComponentGroup Id="AppComponents">
          "@

          foreach ($id in $components) {
              $xml += "      <ComponentRef Id=""$id"" />`n"
          }

          $xml += @"
              </ComponentGroup>
            </Fragment>
          </Wix>
          "@

          Set-Content -Path $out -Value $xml

      - name: Install WiX Toolset
        run: choco install wixtoolset --yes

      - name: Build MSI
        run: |
          candle.exe installer/installer.wxs dist-components.wxs -dAppDir=dist
          light.exe installer.wixobj dist-components.wixobj -ext WixUIExtension -o passwdmngr.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: passwdmngr-msi
          path: passwdmngr.msi
