name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-blueprint-compiler

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          make clean
          make build-windows

      - name: Prepare dist folder
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp passwdmngr.exe dist/
          cp /mingw64/bin/libgtk-4-1.dll dist/
          cp /mingw64/bin/libgdk_pixbuf-2.0-0.dll dist/
          cp /mingw64/bin/libgio-2.0-0.dll dist/
          cp /mingw64/bin/libgobject-2.0-0.dll dist/
          cp /mingw64/bin/libglib-2.0-0.dll dist/
          cp /mingw64/bin/libgmodule-2.0-0.dll dist/
          cp /mingw64/bin/libgthread-2.0-0.dll dist/
          cp /mingw64/bin/libjson-glib-1.0-0.dll dist/
          cp /mingw64/bin/libcairo-2.dll dist/
          cp /mingw64/bin/libcairo-gobject-2.dll dist/
          cp /mingw64/bin/libepoxy-0.dll dist/
          cp /mingw64/bin/libgraphene-1.0-0.dll dist/
          cp /mingw64/bin/libpixman-1-0.dll dist/
          cp /mingw64/bin/libpango-1.0-0.dll dist/
          cp /mingw64/bin/libpangocairo-1.0-0.dll dist/
          cp /mingw64/bin/libpangoft2-1.0-0.dll dist/
          cp /mingw64/bin/libpangowin32-1.0-0.dll dist/
          cp /mingw64/bin/libharfbuzz-0.dll dist/
          cp /mingw64/bin/libharfbuzz-gobject-0.dll dist/
          cp /mingw64/bin/libfribidi-0.dll dist/
          cp /mingw64/bin/libpng16-16.dll dist/
          cp /mingw64/bin/libjpeg-8.dll dist/
          cp /mingw64/bin/libtiff-6.dll dist/
          cp /mingw64/bin/libwebp-7.dll dist/
          cp /mingw64/bin/libwebpdecoder-3.dll dist/
          cp /mingw64/bin/libwebpdemux-2.dll dist/
          cp /mingw64/bin/libwebpmux-3.dll dist/
          cp /mingw64/bin/libgif-7.dll dist/
          cp /mingw64/bin/libLerc.dll dist/
          cp /mingw64/bin/zlib1.dll dist/
          cp /mingw64/bin/liblzma-5.dll dist/
          cp /mingw64/bin/libcharset-1.dll dist/
          cp /mingw64/bin/libiconv-2.dll dist/
          cp /mingw64/bin/libsodium-26.dll dist/
          cp /mingw64/bin/libcrypto-3-x64.dll dist/
          cp /mingw64/bin/libssl-3-x64.dll dist/
          cp /mingw64/bin/libffi-8.dll dist/
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/
          cp /mingw64/bin/libstdc++-6.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          cp /mingw64/bin/libintl-8.dll dist/
          cp /mingw64/bin/libpcre2-8-0.dll dist/
          cp /mingw64/bin/libcairo-script-interpreter-2.dll dist/
          cp /mingw64/bin/libfontconfig-1.dll dist/
          cp /mingw64/bin/libgstallocators-1.0-0.dll dist/
          cp /mingw64/bin/libgstgl-1.0-0.dll dist/
          cp /mingw64/bin/libgstd3d12-1.0-0.dll dist/

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

  build-msi:
    runs-on: windows-latest
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Install WiX Toolset
        run: choco install wixtoolset --yes

      - name: Build MSI
        run: |
          candle.exe installer/installer.wxs -dAppDir=dist -o installer.wixobj
          light.exe installer.wixobj -o passwdmngr.msi -ext WixUIExtension

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: passwdmngr-msi
          path: passwdmngr.msi
