name: Build Linux Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkgconf \
            libgtk-4-dev \
            libglib2.0-dev \
            libjson-glib-dev \
            libsodium-dev \
            libssl-dev

      - name: Install Flatpak Blueprint compiler
        run: |
          sudo apt update
          sudo apt install -y flatpak
          flatpak install -y --noninteractive \
            https://dl.flathub.org/repo/appstream/org.gtk.BlueprintCompiler.flatpakref

          # Create wrapper so Makefile doesn't need changes
          sudo mkdir -p /usr/local/bin/flatpak-blueprint-wrapper
          sudo tee /usr/local/bin/flatpak-blueprint-wrapper/blueprint-compiler > /dev/null << 'EOF'
          #!/usr/bin/env bash
          flatpak run org.gtk.BlueprintCompiler "$@"
          EOF
          sudo chmod +x /usr/local/bin/flatpak-blueprint-wrapper/blueprint-compiler

          # Prepend wrapper directory to PATH
          export PATH="/usr/local/bin/flatpak-blueprint-wrapper:$PATH"

      - name: Build app
        run: |
          make clean
          make

      - name: Upload passwdmngr binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: passwdmngr