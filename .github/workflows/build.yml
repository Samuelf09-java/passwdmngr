name: Build App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4 and build tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkgconf \
            libgtk-4-dev \
            libglib2.0-dev \
            libjson-glib-dev \
            libsodium-dev \
            libssl-dev \
            python3 python3-pip \
            meson ninja-build \

      - name: Build and install Blueprint compiler
        run: |
          git clone https://gitlab.gnome.org/jwestman/blueprint-compiler.git
          cd blueprint-compiler
          meson setup build
          ninja -C build
          sudo ninja -C build install

      - name: Create wrapper for blueprint-compiler
        run: |
          sudo mkdir -p /usr/local/bin/blueprint-wrapper
          sudo tee /usr/local/bin/blueprint-wrapper/blueprint-compiler > /dev/null << 'EOF'
          #!/usr/bin/env bash
          export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH
          exec /usr/local/bin/blueprint-compiler "$@"
          EOF
          sudo chmod +x /usr/local/bin/blueprint-wrapper/blueprint-compiler

      - name: Build Linux executable
        run: |
          export PATH="/usr/local/bin/blueprint-wrapper:$PATH"
          make clean
          make

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: built-binary
          path: |
            passwdmngr